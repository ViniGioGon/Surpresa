  <circle cx="100" cy="100" r="54" fill="none" stroke="#ffd166" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6"/>
  
  <!-- Monogram & Spark Heart -->
  <path d="M 100 115 C 90 100, 68 85, 68 68 C 68 53, 80 44, 93 44 C 98 44, 100 48, 100 48 C 100 48, 102 44, 107 44 C 120 44, 132 53, 132 68 C 132 85, 110 100, 100 115 Z"
