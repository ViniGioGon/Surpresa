      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="40%" stop-color="#b5179e"/>
      <stop offset="70%" stop-color="#7209b7"/>
      <stop offset="100%" stop-color="#3a0128"/>
    </radialGradient>
    <filter id="waxShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
