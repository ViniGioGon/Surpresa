<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="albumGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff758f"/>
      <stop offset="60%" stop-color="#7209b7"/>
      <stop offset="100%" stop-color="#1b0022"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0f3"/>
      <stop offset="50%" stop-color="#ffccd5"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>
    <linearGradient id="candle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffea00"/>
      <stop offset="50%" stop-color="#ff70a6"/>
      <stop offset="100%" stop-color="#700c24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="#0d040a"/>
  <rect width="500" height="500" fill="url(#albumGlow)" opacity="0.65"/>

  <!-- Vintage Vinyl Texture Rings -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
  <circle cx="250" cy="250" r="200" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <circle cx="250" cy="250" r="170" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  <circle cx="250" cy="250" r="140" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Soft Electrical Circuit Lines in Cover -->
  <path d="M 40 100 H 120 V 160 H 180" fill="none" stroke="#ff758f" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
  <circle cx="180" cy="160" r="3" fill="#ffb703"/>
  <path d="M 460 400 H 380 V 340 H 320" fill="none" stroke="#64dfdf" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
  <circle cx="320" cy="340" r="3" fill="#64dfdf"/>

  <!-- Center Heart & Glue Motif -->
  <g filter="url(#shadow)">
    <!-- Glowing Aura -->
    <circle cx="250" cy="220" r="90" fill="rgba(255, 117, 143, 0.25)"/>
    <!-- Stylized Heart -->
    <path d="M 250 265 C 230 240, 180 200, 180 160 C 180 130, 205 110, 235 110 C 248 110, 260 120, 250 135 C 240 120, 252 110, 265 110 C 295 110, 320 130, 320 160 C 320 200, 270 240, 250 265 Z"
          fill="url(#candle)" stroke="#fff" stroke-width="3" stroke-opacity="0.6"/>
    <!-- Tiny Sparkles / Sparks -->
    <polygon points="250,90 253,98 261,101 253,104 250,112 247,104 239,101 247,98" fill="#ffd166"/>
    <polygon points="330,130 332,136 338,138 332,140 330,146 328,140 322,138 328,136" fill="#ffd166"/>
  </g>

  <!-- Typography -->
  <text x="250" y="335" font-family="'Cinzel', Georgia, serif" font-size="28" font-weight="700" fill="url(#goldText)" text-anchor="middle" letter-spacing="4">GLUE SONG</text>
  <text x="250" y="365" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#fca5b7" text-anchor="middle" letter-spacing="3">BEABADOOBEE</text>
  
  <text x="250" y="405" font-family="'Cinzel', serif" font-size="12" fill="#e2c4a6" text-anchor="middle" letter-spacing="2">I'VE NEVER KNOWN SOMEONE LIKE YOU</text>
  <text x="250" y="430" font-family="'Noto Serif JP', serif" font-size="14" fill="#ff758f" text-anchor="middle" opacity="0.8">大切な人 • 愛</text>

  <!-- Golden Delicate Border -->
  <rect x="20" y="20" width="460" height="460" fill="none" stroke="rgba(255, 183, 3, 0.4)" stroke-width="1.5" rx="8"/>
  <rect x="26" y="26" width="448" height="448" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" rx="6"/>
</svg>
