<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#4e0d1d"/>
      <stop offset="55%" stop-color="#22050c"/>
      <stop offset="100%" stop-color="#0b0204"/>
    </radialGradient>
    <linearGradient id="goldLg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffccd5"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGlow)"/>

  <!-- Subtle Circuit Traces -->
  <path d="M 60 80 H 220 V 180 H 350" fill="none" stroke="rgba(255, 117, 143, 0.25)" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="350" cy="180" r="4" fill="#ffb703"/>
  <path d="M 740 520 H 580 V 420 H 450" fill="none" stroke="rgba(100, 223, 223, 0.25)" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="450" cy="420" r="4" fill="#64dfdf"/>

  <!-- Center Card Area -->
  <g filter="url(#cardShadow)">
    <rect x="120" y="80" width="560" height="440" rx="20" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 117, 143, 0.3)" stroke-width="1.5"/>
    <circle cx="400" cy="220" r="65" fill="rgba(255, 117, 143, 0.12)" stroke="rgba(255, 183, 3, 0.3)" stroke-width="1"/>
    <text x="400" y="240" font-size="52" text-anchor="middle">🐾</text>

    <text x="400" y="325" font-family="'Cinzel', Georgia, serif" font-size="28" font-weight="700" fill="url(#goldLg)" text-anchor="middle" letter-spacing="2">Nosso Gatinho Niko</text>
    <text x="400" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#fca5b7" text-anchor="middle" letter-spacing="1">A Mascote do Casal</text>
    <text x="400" y="395" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="20" fill="#fff0f3" text-anchor="middle">"Pequeno companheiro da nossa história."</text>

    <rect x="220" y="435" width="360" height="34" rx="17" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.15)"/>
    <text x="400" y="457" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#e2c4a6" text-anchor="middle">📷 Espaço reservado • Adicione sua foto real</text>
  </g>

  <!-- Ornate Border -->
  <rect x="25" y="25" width="750" height="550" rx="12" fill="none" stroke="rgba(255, 117, 143, 0.15)" stroke-width="1"/>
</svg>
