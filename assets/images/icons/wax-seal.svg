  <!-- Irregular organic wax seal outline -->
  <path d="M 100 20 C 130 18, 150 32, 170 50 C 190 70, 185 105, 180 130 C 175 155, 155 178, 130 182 C 105 186, 75 180, 50 165 C 25 150, 18 120, 20 95 C 22 70, 38 42, 65 28 C 80 20, 90 22, 100 20 Z"
